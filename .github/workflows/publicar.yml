# Publica o site no GitHub Pages a cada alteração na branch main.
# O build falha se uma página marcada como publicada ainda tiver bloco "A CONFIRMAR"; nesse caso nada é publicado.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Na publicação, só vão ao ar as páginas marcadas como publicadas (paginasPublicadas no evento.config.json).
      - run: npm run build
        env:
          OCULTAR_RASCUNHOS: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
